<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piscina Custo — Manutenção de Piscina | Praia Digital</title><meta name="description" content="Quanto custa por mês manter uma piscina em imóvel de temporada no litoral: produtos, energia, limpeza e ROI na diária."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#e0f2f7,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #0b6fa422}h1{color:#04668a;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #cfe8f0;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#0480a8;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#e6f5fa;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#0480a8;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/amenidade-roi">Amenidade ROI</a> · <a href="https://praia.digital/energia-solar">Energia Solar</a> · <a href="https://praia.digital/maresia-guard">Maresia Guard</a></nav><div class="card"><h1>🏊 Piscina Custo</h1><p>A piscina valoriza a diária — mas quanto ela come do seu lucro?</p><label>Tamanho da piscina</label><select id="t"><option value="180">Pequena (até 15 m²)</option><option value="300" selected>Média (15–30 m²)</option><option value="480">Grande (30+ m²)</option></select><label>Bomba ligada (horas/dia)</label><input id="b" type="number" value="6"><label>Aquecimento?</label><select id="a"><option value="0" selected>Não</option><option value="220">Solar</option><option value="450">Elétrico/trocador</option></select><label>Quem limpa?</label><select id="p"><option value="0">Eu mesmo</option><option value="350" selected>Piscineiro 1x/semana</option><option value="600">Piscineiro 2x/semana</option></select><label>Aumento da diária por ter piscina (R$)</label><input id="d" type="number" value="80"><label>Diárias vendidas/mês</label><input id="v" type="number" value="12"><button onclick="calc()">Calcular</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const t=g('t'),b=g('b'),a=g('a'),p=g('p'),d=g('d'),v=g('v');const kwh=b*0.55*30*0.92,custo=t+a+p+kwh,receita=d*v,saldo=receita-custo;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>⚡ Energia da bomba: R$ ${kwh.toFixed(0)}/mês</p><p>🧪 Produtos + limpeza + aquecimento: R$ ${(t+a+p).toFixed(0)}/mês</p><p>💸 Custo total: <b>R$ ${custo.toFixed(0)}/mês</b></p><p>📈 Receita extra gerada: <b>R$ ${receita.toFixed(0)}/mês</b> → saldo <b style="color:${saldo>=0?'#2e8b57':'#c0392b'}">R$ ${saldo.toFixed(0)}</b></p><p>💡 ${saldo<0?'A piscina está no prejuízo — suba a diária ou reduza horas de bomba. Veja o <a href="https://praia.digital/amenidade-roi">Amenidade ROI</a>.':'Piscina lucrativa! Potencialize com solar: <a href="https://praia.digital/energia-solar">Energia Solar</a>.'}</p>`}</script></body></html>
